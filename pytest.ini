[pytest]
testpaths = evals
pythonpath = .
addopts = -p no:rerunfailures
markers =
    stress: paired 10, 100, and 1000 agent rosters
    live: calls a live model provider
    smoke: fast representative routing evaluation
    standard: complete authored routing cases
    full: authored and generated overload evaluation
    grader_live: live semantic-grader validation
    stability: repeated equivalent routing cases
